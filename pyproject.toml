[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "--basetemp=.cache/pytest"
# Starlette 1.x still supports httpx, used by our Gemini adapter and TestClient.
# Keep only this upstream migration notice exempt from warnings-as-errors.
filterwarnings = ["error", 'ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning']

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

